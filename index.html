<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mud Fever Sales Report</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
[data-theme="dark"]{--bg:#0c0c0f;--surface:#141418;--surface2:#1c1c22;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#f0f0f2;--muted:#8888a0;--dim:#55556a;--accent:#b78cff;--accent-bg:rgba(183,140,255,.12);--green:#3ddc84;--green-bg:rgba(61,220,132,.11);--amber:#ffb347;--amber-bg:rgba(255,179,71,.11);--red:#ff6b6b;--red-bg:rgba(255,107,107,.10)}
[data-theme="light"]{--bg:#f4f5f7;--surface:#fff;--surface2:#f0f1f4;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);--text:#111118;--muted:#666680;--dim:#aaaabc;--accent:#6842b8;--accent-bg:rgba(104,66,184,.09);--green:#1a9a56;--green-bg:rgba(26,154,86,.09);--amber:#c47a00;--amber-bg:rgba(196,122,0,.09);--red:#cc3333;--red-bg:rgba(204,51,51,.08)}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh}.shell{max-width:1420px;margin:0 auto;padding:28px 20px 64px}.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:20px}.hdr h1{font-size:24px;font-weight:800;letter-spacing:-.03em}.hdr h1 span{color:var(--accent)}.hdr-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.period-box{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 13px;text-align:right}.period-box .wk{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}.period-box .pd{font-size:12px;font-weight:700;margin-top:1px}.ctrl-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tab-bar{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:3px}.tab{font-family:'DM Mono',monospace;font-size:10px;padding:4px 11px;border-radius:5px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-weight:500}.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}select.sel{background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;border-radius:6px;padding:5px 9px;cursor:pointer;min-width:185px}.btn{font-family:'DM Mono',monospace;font-size:11px;border-radius:7px;padding:5px 12px;cursor:pointer;border:1px solid}.btn-refresh{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}.btn-theme{background:var(--surface2);border-color:var(--border2);color:var(--muted);font-size:14px;padding:4px 9px}.loading{text-align:center;padding:80px 20px;font-family:'DM Mono',monospace;color:var(--muted);font-size:12px}.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.err-box{background:var(--red-bg);border:1px solid var(--red);border-radius:10px;padding:14px 18px;font-family:'DM Mono',monospace;font-size:11px;color:var(--red);margin-bottom:18px;white-space:pre-wrap}.notice{background:var(--accent-bg);border:1px solid var(--border2);border-radius:9px;padding:11px 15px;margin-bottom:22px;font-size:11px;color:var(--accent);font-family:'DM Mono',monospace;line-height:1.7}.warning{background:var(--amber-bg);border:1px solid rgba(255,179,71,.32);color:var(--amber)}.slbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 9px;font-family:'DM Mono',monospace}.summary-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 15px}.card .lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.card .val{font-size:21px;font-weight:800;margin-top:3px;white-space:nowrap}.card .desc{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.4}.card.good{background:var(--green-bg);border-color:rgba(61,220,132,.24)}.card.warn{background:var(--amber-bg);border-color:rgba(255,179,71,.24)}.card.final{background:var(--accent-bg);border-color:rgba(183,140,255,.32)}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}table{width:100%;border-collapse:collapse}.tbl th{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--surface2);position:sticky;top:0}.tbl th.r{text-align:right}.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);font-size:11px;vertical-align:top}.tbl td.r{text-align:right;font-family:'DM Mono',monospace}.mono{font-family:'DM Mono',monospace}.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:600;font-family:'DM Mono',monospace}.b-sale{background:var(--green-bg);color:var(--green)}.b-mkt{background:var(--amber-bg);color:var(--amber)}.b-ret{background:var(--red-bg);color:var(--red)}.pname{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.email{font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap}.sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}.empty{text-align:center;padding:55px 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;line-height:1.8}.footer{margin-top:32px;padding:13px 17px;background:var(--surface);border-radius:10px;border:1px solid var(--border);font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;line-height:1.8}.footer span{color:var(--muted)}@media(max-width:1100px){.summary-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.summary-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div><h1><span>Mud Fever</span> Sales Report</h1><div class="hdr-sub">GitHub Pages dashboard - generated by GitHub Actions from Shopify</div></div>
    <div class="hdr-right"><div class="period-box"><div class="wk">period</div><div class="pd" id="periodLabel">Loading...</div></div><div class="ctrl-row"><div class="tab-bar"><button class="tab" id="tabWeek" onclick="setMode('week')">By Week</button><button class="tab active" id="tabMonth" onclick="setMode('month')">By Month</button><button class="tab" id="tabQuarter" onclick="setMode('quarter')">By Quarter</button></div><div id="weekCtrl" style="display:none"><select class="sel" id="weekSelect" onchange="loadSelected()"></select></div><div id="monthCtrl"><select class="sel" id="monthSelect" onchange="loadSelected()"></select></div><div id="quarterCtrl" style="display:none"><select class="sel" id="quarterSelect" onchange="loadSelected()"></select></div><button class="btn btn-refresh" id="refreshBtn" onclick="reloadBundle()">Refresh data</button><button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">Light</button></div></div>
  </div>
  <div id="main"><div class="loading"><div class="spinner"></div>Loading Mud Fever Sales Report...</div></div>
</div>
<script>
var REPORT_BUNDLE=null;
var savedTheme=typeof localStorage!=='undefined'&&localStorage.getItem('theme');if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);document.getElementById('themeBtn').textContent=next==='dark'?'Light':'Dark';try{localStorage.setItem('theme',next)}catch(e){}}(function(){var t=document.documentElement.getAttribute('data-theme');var btn=document.getElementById('themeBtn');if(btn)btn.textContent=t==='dark'?'Light':'Dark';})();
var MODE_KEY='mud_fever_report_mode_github_v1';var KEY_PREFIX='mud_fever_report_key_';
function getStored(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function setStored(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function getInitialMode(){var m=getStored(MODE_KEY);return (m==='week'||m==='month'||m==='quarter')?m:'month';}
var currentMode=getInitialMode();
function applyModeUi(){document.getElementById('tabWeek').classList.toggle('active',currentMode==='week');document.getElementById('tabMonth').classList.toggle('active',currentMode==='month');document.getElementById('tabQuarter').classList.toggle('active',currentMode==='quarter');document.getElementById('weekCtrl').style.display=currentMode==='week'?'':'none';document.getElementById('monthCtrl').style.display=currentMode==='month'?'':'none';document.getElementById('quarterCtrl').style.display=currentMode==='quarter'?'':'none';}
function setMode(mode){currentMode=mode;setStored(MODE_KEY,mode);applyModeUi();loadSelected();}
function reloadBundle(){document.getElementById('main').innerHTML='<div class="loading"><div class="spinner"></div>Loading generated report-data.json...</div>';fetch('data/report-data.json?ts='+Date.now()).then(function(r){if(!r.ok)throw new Error('Could not load data/report-data.json. Run the GitHub Action first. HTTP '+r.status);return r.json();}).then(function(bundle){REPORT_BUNDLE=bundle;buildOptions();applyModeUi();loadSelected();}).catch(function(err){showError(err.message||err);});}
function buildOptions(){if(!REPORT_BUNDLE)return;buildSelect('monthSelect',REPORT_BUNDLE.periods.months||[]);buildSelect('quarterSelect',REPORT_BUNDLE.periods.quarters||[]);buildSelect('weekSelect',REPORT_BUNDLE.periods.weeks||[]);}
function buildSelect(id,items){var sel=document.getElementById(id);var mode=id.replace('Select','');var saved=getStored(KEY_PREFIX+mode);sel.innerHTML='';items.forEach(function(p,i){var opt=document.createElement('option');opt.value=p.key;opt.textContent=p.label;if(saved&&saved===p.key)opt.selected=true;else if(!saved&&i===0)opt.selected=true;sel.appendChild(opt);});if(mode==='month'&&!saved&&sel.options.length>1)sel.options[1].selected=true;}
function currentSelect(){return document.getElementById(currentMode+'Select');}
function loadSelected(){if(!REPORT_BUNDLE)return;var sel=currentSelect();var key=sel&&sel.value;if(!key){showError('No generated period available for '+currentMode+'.');return;}setStored(KEY_PREFIX+currentMode,key);var data=REPORT_BUNDLE.reports&&REPORT_BUNDLE.reports[key];if(!data){showError('This period was not found in data/report-data.json: '+key);return;}if(data.error){showError(data.error);return;}render(data);}
function showError(msg){document.getElementById('main').innerHTML='<div class="err-box">'+escHtml(msg)+'</div>';}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function fmt(n){n=Number(n||0);return '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}function num(n){return Number(n||0).toLocaleString();}function fmtDate(s){if(!s)return'';var d=new Date(s);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}function card(label,val,desc,cls){return '<div class="card '+(cls||'')+'"><div class="lbl">'+escHtml(label)+'</div><div class="val">'+escHtml(val)+'</div><div class="desc">'+escHtml(desc)+'</div></div>';}
function emptyStateHtml(data,stats){var label=escHtml((data&&data.period_label)||'Selected period');var scanned=num((stats&&stats.total_orders_scanned)||0);return '<div class="empty"><b>No Mud Fever activity found</b><br>No Mud Fever lines were found for '+label+'.<br><span>Orders scanned: '+scanned+'.</span></div>';}
function render(data){data=data||{};var s=data.summary||{},stats=data.stats||{};document.getElementById('periodLabel').textContent=data.period_label||'-';if((stats.mud_fever_lines||0)===0){document.getElementById('main').innerHTML=emptyStateHtml(data,stats);return;}var commercial=(data.rows||[]).filter(function(r){return r.type==='Commercial Sale';});var marketing=(data.rows||[]).filter(function(r){return r.type==='Marketing';});var credits=(data.rows||[]).filter(function(r){return r.type==='Credit/Return';});var html='';if(data.warnings&&data.warnings.length){html+='<div class="notice warning">'+escHtml(data.warnings.join(' | '))+'</div>';}var inv=data.inventory_status||{};function hasVal(v){return !(v===null||v===undefined||v===''||String(v)==='N/A');}function invNum(v){return hasVal(v)?num(v):'N/A';}function firstVal(a,b){return hasVal(a)?a:b;}var hasInventoryConfig=hasVal(inv.period_opening_balance)||hasVal(inv.period_ending_balance)||hasVal(inv.current_shopify_stock_available)||hasVal(s.current_shopify_stock_available);if(hasInventoryConfig){html+='<div class="slbl">Inventory Status</div><div class="summary-grid">'+card('Opening Stock',invNum(firstVal(inv.period_opening_balance,s.starting_balance)),'Stock available before selected period.')+card('Units Sold',num(s.commercial_units_sold),'Commercial units sold in selected period.','good')+card('Marketing Units',num(s.marketing_units_seeded),'Seeded / marketing units in selected period.','warn')+card('Ending Stock',invNum(firstVal(inv.period_ending_balance,s.ending_balance)),'Ending stock for selected period.')+card('Current Shopify Stock',invNum(firstVal(inv.current_shopify_stock_available,s.current_shopify_stock_available)),'Live available stock at '+(inv.location_name||'New Wellington Warehouse')+'.','final')+'</div>';}
html+='<div class="slbl">Core KPIs</div><div class="summary-grid">'+card('Gross Sales',fmt(s.gross_sales),'All Mud Fever line gross sales in selected range.')+card('Units in Range',num(s.units_in_range),'Commercial + marketing + credits/returns.')+card('Net Sales',fmt(s.net_sales),'Gross sales minus discounts and refunds/returns.')+card('Number of Orders',num(s.order_count),'Unique orders containing Mud Fever.')+card('Discount',fmt(s.discount),'Total Mud Fever line discounts.')+card('COGS',fmt(s.cogs),'Qty x Shopify inventory item cost.')+'</div>';
html+='<div class="slbl">Commercial Sales</div>'+renderRows(commercial);html+='<div class="slbl">Marketing Activities / Seeded Units</div>'+renderRows(marketing);if(credits.length){html+='<div class="slbl">Deductions / Credits Detail</div>'+renderRows(credits);}html+='<div class="slbl">All Mud Fever Detail</div>'+renderRows(data.rows||[]);html+='<div class="footer"><span>Generated:</span> '+escHtml(data.generated||data.generated_at||'')+' · <span>Orders scanned:</span> '+(stats.total_orders_scanned||0)+' · <span>Mud Fever lines:</span> '+(stats.mud_fever_lines||0)+'.</div>';document.getElementById('main').innerHTML=html;}
function renderRows(rows){if(!rows.length)return '<div class="empty">No rows in this section.</div>';var out='<div class="table-wrap"><table class="tbl"><thead><tr><th class="r">Order #</th><th>Date</th><th>Customer</th><th>Customer Email</th><th>Product</th><th>Category</th><th class="r">Qty</th><th class="r">Gross</th><th class="r">Discount</th><th class="r">Net</th><th class="r">Unit COGS</th><th class="r">COGS</th><th class="r">Marketing Shipping Deduction</th></tr></thead><tbody>';out+=rows.map(function(o){var kind=o.type==='Commercial Sale'?'sale':(o.type==='Marketing'?'marketing':'return');var badgeClass=kind==='sale'?'b-sale':(kind==='marketing'?'b-mkt':'b-ret');var label=kind==='sale'?'Regular Order':(kind==='marketing'?'Marketing / Seeded':'Credit / Return');var variant=o.variant?'<div class="sub">'+escHtml(o.variant)+'</div>':'';var cogsSub=o.cogs_status&&o.cogs_status!=='OK'?'<div class="sub">'+escHtml(o.cogs_status)+'</div>':'';return '<tr><td class="r"><div class="mono">'+escHtml(o.order_id)+'</div></td><td>'+fmtDate(o.order_date)+'</td><td>'+escHtml(o.customer||'N/A')+'</td><td><div class="email">'+escHtml(o.customer_email||'-')+'</div></td><td><div class="pname" title="'+escHtml(o.product)+'">'+escHtml(o.product)+'</div>'+variant+'<div class="sub">SKU '+escHtml(o.sku||'-')+'</div></td><td><span class="badge '+badgeClass+'">'+label+'</span><div class="sub">'+escHtml(o.reason||'')+'</div></td><td class="r">'+num(o.quantity)+'</td><td class="r">'+fmt(o.gross)+'</td><td class="r">'+fmt(o.discount)+'</td><td class="r">'+fmt(o.net)+'</td><td class="r">'+fmt(o.unit_cogs)+cogsSub+'</td><td class="r">'+fmt(o.cogs)+'</td><td class="r">'+fmt(o.marketing_shipping_deduction||0)+'</td></tr>';}).join('');out+='</tbody></table></div>';return out;}
reloadBundle();
</script>
</body>
</html>
